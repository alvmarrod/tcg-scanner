[project]
name = "tcg-scanner"
version = "0.1.0"
description = "Identify One Piece TCG cards from photos and track owned cards with prices"
readme = "README.md"
authors = [
    { name = "Alvaro MR", email = "btc@hotmail.es" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "easyocr>=1.7.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
tcg-scanner = "tcg_scanner:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
